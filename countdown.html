<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Countdown to October 5, 2026</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    overflow:hidden;
    color:white;

    background:
    radial-gradient(circle at 15% 20%, #6366f1 0%, transparent 35%),
    radial-gradient(circle at 85% 80%, #06b6d4 0%, transparent 35%),
    linear-gradient(135deg,#020617,#0f172a,#111827);

    background-size:200% 200%;
    animation:gradientShift 20s ease infinite;
}

@keyframes gradientShift{
    0%{background-position:0% 50%;}
    50%{background-position:100% 50%;}
    100%{background-position:0% 50%;}
}

#particles{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    z-index:0;
}

.container{
    position:relative;
    z-index:5;
    width:min(95%,1000px);
    padding:20px;
}

.card{
    background:rgba(255,255,255,.08);
    backdrop-filter:blur(24px);
    -webkit-backdrop-filter:blur(24px);

    border:1px solid rgba(255,255,255,.15);
    border-radius:32px;

    padding:50px;
    text-align:center;

    box-shadow:
        0 25px 60px rgba(0,0,0,.45),
        inset 0 1px 0 rgba(255,255,255,.1);

    animation:floatCard 8s ease-in-out infinite;
}

@keyframes floatCard{
    0%,100%{ transform:translateY(0); }
    50%{ transform:translateY(-8px); }
}

.badge{
    display:inline-block;
    padding:10px 18px;

    border-radius:999px;
    background:rgba(255,255,255,.1);
    border:1px solid rgba(255,255,255,.15);

    text-transform:uppercase;
    font-size:.8rem;
    letter-spacing:.15em;

    margin-bottom:20px;
}

h1{
    font-size:clamp(2rem,5vw,4.5rem);
    font-weight:800;
    margin-bottom:10px;

    text-shadow:0 0 30px rgba(99,102,241,.5);
}

.subtitle{
    color:rgba(255,255,255,.8);
    margin-bottom:40px;
    font-size:1.1rem;
}

.timer{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:20px;
}

.unit{
    background:rgba(255,255,255,.08);
    border:1px solid rgba(255,255,255,.12);
    border-radius:24px;
    padding:28px 12px;
    transition:.3s ease;
}

.unit:hover{
    transform:translateY(-5px);
    background:rgba(255,255,255,.12);
    box-shadow:0 10px 25px rgba(99,102,241,.25);
}

.value{
    font-size:clamp(2rem,4vw,4rem);
    font-weight:800;
}

.label{
    margin-top:8px;
    color:rgba(255,255,255,.7);
    text-transform:uppercase;
    letter-spacing:.15em;
    font-size:.85rem;
}

.progress-container{
    width:100%;
    height:10px;
    overflow:hidden;

    margin-top:30px;

    border-radius:999px;
    background:rgba(255,255,255,.10);
}

.progress-bar{
    height:100%;
    width:0%;

    background:
        linear-gradient(
            90deg,
            #06b6d4,
            #6366f1,
            #8b5cf6
        );

    border-radius:999px;
    transition:width 1s linear;
}

.footer{
    margin-top:25px;
    color:rgba(255,255,255,.7);
}

@media(max-width:700px){

    .timer{
        grid-template-columns:repeat(2,1fr);
    }

    .card{
        padding:30px;
    }
}
</style>
</head>
<body>

<canvas id="particles"></canvas>

<div class="container">

    <div class="card">

        <div class="badge">Live Countdown</div>

        <h1>October 5, 2026</h1>

        <div class="subtitle">
            Counting down to 5:00 PM
        </div>

        <div class="timer">

            <div class="unit">
                <div class="value" id="days">0</div>
                <div class="label">Days</div>
            </div>

            <div class="unit">
                <div class="value" id="hours">0</div>
                <div class="label">Hours</div>
            </div>

            <div class="unit">
                <div class="value" id="minutes">0</div>
                <div class="label">Minutes</div>
            </div>

            <div class="unit">
                <div class="value" id="seconds">0</div>
                <div class="label">Seconds</div>
            </div>

        </div>

        <div class="progress-container">
            <div id="progressBar" class="progress-bar"></div>
        </div>

        <div id="footer" class="footer">
            Updating every second...
        </div>

    </div>

</div>

<script>
/* COUNTDOWN */

const targetDate = new Date(2026, 9, 5, 17, 0, 0);
const pageLoad = new Date();

function updateCountdown(){

    const now = new Date();
    const diff = targetDate - now;

    if(diff <= 0){

        document.querySelector(".timer").innerHTML =
        '<div style="grid-column:1/-1;font-size:3rem;font-weight:800;">🎉 Time Reached!</div>';

        document.getElementById("progressBar").style.width="100%";

        return;
    }

    const days =
        Math.floor(diff/(1000*60*60*24));

    const hours =
        Math.floor((diff%(1000*60*60*24))/(1000*60*60));

    const minutes =
        Math.floor((diff%(1000*60*60))/(1000*60));

    const seconds =
        Math.floor((diff%(1000*60))/1000);

    document.getElementById("days").textContent=days;
    document.getElementById("hours").textContent=hours;
    document.getElementById("minutes").textContent=minutes;
    document.getElementById("seconds").textContent=seconds;

    const totalDuration = targetDate - pageLoad;
    const elapsed = now - pageLoad;

    const progress =
        Math.min((elapsed/totalDuration)*100,100);

    document.getElementById("progressBar").style.width =
        progress + "%";
}

updateCountdown();
setInterval(updateCountdown,1000);

/* PARTICLES */

const canvas = document.getElementById("particles");
const ctx = canvas.getContext("2d");

function resizeCanvas(){
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
}

resizeCanvas();
window.addEventListener("resize", resizeCanvas);

const mouse = {
    x:null,
    y:null
};

window.addEventListener("mousemove",(e)=>{
    mouse.x = e.clientX;
    mouse.y = e.clientY;
});

class Particle{

    constructor(){

        this.x = Math.random()*canvas.width;
        this.y = Math.random()*canvas.height;

        this.vx = (Math.random()-0.5)*0.15;
        this.vy = (Math.random()-0.5)*0.15;

        this.radius = Math.random()*2+1;
        this.opacity = Math.random()*0.4+0.2;
    }

    update(){

        this.x += this.vx;
        this.y += this.vy;

        if(this.x < 0 || this.x > canvas.width)
            this.vx *= -1;

        if(this.y < 0 || this.y > canvas.height)
            this.vy *= -1;

        if(mouse.x){

            const dx = mouse.x - this.x;
            const dy = mouse.y - this.y;

            const distance =
                Math.sqrt(dx*dx + dy*dy);

            if(distance < 120){

                this.x -= dx * 0.0007;
                this.y -= dy * 0.0007;
            }
        }
    }

    draw(){

        const glow =
            ctx.createRadialGradient(
                this.x,
                this.y,
                0,
                this.x,
                this.y,
                this.radius * 7
            );

        glow.addColorStop(
            0,
            `rgba(255,255,255,${this.opacity})`
        );

        glow.addColorStop(
            1,
            "rgba(255,255,255,0)"
        );

        ctx.fillStyle = glow;

        ctx.beginPath();
        ctx.arc(
            this.x,
            this.y,
            this.radius * 7,
            0,
            Math.PI*2
        );
        ctx.fill();

        ctx.beginPath();
        ctx.fillStyle =
            `rgba(255,255,255,${this.opacity})`;

        ctx.arc(
            this.x,
            this.y,
            this.radius,
            0,
            Math.PI*2
        );
        ctx.fill();
    }
}

const particles = [];
const particleCount = 80;

for(let i=0;i<particleCount;i++){
    particles.push(new Particle());
}

function drawConnections(){

    for(let a=0;a<particles.length;a++){

        for(let b=a+1;b<particles.length;b++){

            const dx =
                particles[a].x -
                particles[b].x;

            const dy =
                particles[a].y -
                particles[b].y;

            const distance =
                Math.sqrt(dx*dx+dy*dy);

            if(distance < 180){

                const opacity =
                    ((180-distance)/180)*0.2;

                ctx.beginPath();

                ctx.moveTo(
                    particles[a].x,
                    particles[a].y
                );

                ctx.lineTo(
                    particles[b].x,
                    particles[b].y
                );

                ctx.strokeStyle =
                    `rgba(255,255,255,${opacity})`;

                ctx.lineWidth = 1;
                ctx.stroke();
            }
        }
    }
}

function animate(){

    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );

    particles.forEach(p=>{
        p.update();
        p.draw();
    });

    drawConnections();

    requestAnimationFrame(animate);
}

animate();
</script>

</body>
</html>
